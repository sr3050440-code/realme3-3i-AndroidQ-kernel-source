name: Build Realme 3i Android Q Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            libncurses5-dev libncurses-dev \
            clang lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python2 python2.7 \
            zip unzip

          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2

          python2 --version
          clang --version
          aarch64-linux-gnu-gcc --version

      - name: Prepare source
        run: |
          git config --global core.autocrlf false

          if [ -f tools/dct/DrvGen.py ]; then
            sed -i 's/\r$//' tools/dct/DrvGen.py
            chmod +x tools/dct/DrvGen.py
          fi

      - name: Configure
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export PYTHON=python2.7

          make O=out oppo6771_defconfig
          make O=out olddefconfig

          echo "===== CONFIG ====="
          grep -E \
            'CONFIG_MACH_MT6771|CONFIG_MTK_PLATFORM|CONFIG_ARCH_MTK_PROJECT|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE' \
            out/.config

      - name: Build kernel
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export PYTHON=python2.7
          export PATH="/usr/lib/llvm-14/bin:$PATH"

          make -j"$(nproc)" \
            O=out \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            PYTHON=python2.7 \
            2>&1 | tee build.log

      - name: Verify output
        run: |
          echo "===== KERNEL OUTPUT ====="
          find out/arch/arm64/boot -maxdepth 2 -type f \
            \( -name 'Image*' -o -name '*.dtb' \) \
            -printf '%p %s bytes\n'

          test -f out/arch/arm64/boot/Image

      - name: Collect artifacts
        run: |
          mkdir -p kernel-output

          cp out/arch/arm64/boot/Image kernel-output/

          for f in \
            Image.gz \
            Image.gz-dtb \
            Image-dtb \
            Image.lz4 \
            Image.lzma \
            Image.xz
          do
            if [ -f "out/arch/arm64/boot/$f" ]; then
              cp "out/arch/arm64/boot/$f" kernel-output/
            fi
          done

          find out/arch/arm64/boot/dts \
            -type f -name 'mt6771*.dtb' \
            -exec cp {} kernel-output/ \; 2>/dev/null || true

          cp build.log kernel-output/

          echo "===== FINAL FILES ====="
          ls -lh kernel-output

      - name: Package
        run: |
          cd kernel-output
          zip -9 ../Realme3i-Kernel.zip *
          cd ..

          ls -lh Realme3i-Kernel.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-Kernel
          path: |
            Realme3i-Kernel.zip
            kernel-output/build.log

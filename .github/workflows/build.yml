name: Upgrade Realme 3i Kernel to 4.14.186

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            libssl-dev libelf-dev

      - name: Show current kernel version
        run: |
          echo "Current kernel version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile || true

      - name: Fetch Linux stable 4.14
        run: |
          git remote add linux-stable \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git

          git fetch linux-stable \
            refs/tags/v4.14.141 \
            refs/tags/v4.14.186

      - name: Create upgrade branch
        run: |
          git checkout -b kernel-4.14.186

      - name: Check upstream base
        run: |
          if git merge-base --is-ancestor v4.14.141 HEAD; then
            echo "UPSTREAM_BASE=true" >> "$GITHUB_ENV"
            echo "Upstream 4.14.141 base found."
          else
            echo "UPSTREAM_BASE=false" >> "$GITHUB_ENV"
            echo "Vendor kernel tree detected."
          fi

      - name: Upgrade kernel
        run: |
          if [ "$UPSTREAM_BASE" = "true" ]; then

            echo "Merging Linux 4.14.186..."
            git merge v4.14.186 \
              --no-commit \
              --no-ff || true

          else

            echo "Creating stable upgrade patch..."

            git diff --binary \
              v4.14.141..v4.14.186 \
              > stable-4.14.141-to-4.14.186.patch

            echo "Applying stable patch..."

            git apply \
              --3way \
              --whitespace=fix \
              stable-4.14.141-to-4.14.186.patch || true

          fi

      - name: Set kernel version
        run: |
          sed -i 's/^SUBLEVEL[[:space:]]*=.*/SUBLEVEL = 186/' Makefile

          echo "Final kernel version:"
          make kernelversion || true

      - name: Check changes
        run: |
          echo "===== GIT STATUS ====="
          git status --short

          echo
          echo "===== CONFLICT FILES ====="
          git diff --name-only --diff-filter=U || true

      - name: Save upgrade result
        uses: actions/upload-artifact@v4
        with:
          name: kernel-4.14.186-upgrade-result
          path: |
            stable-4.14.141-to-4.14.186.patch

      - name: Commit upgraded source
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          git commit -m "Upgrade kernel to Linux 4.14.186" || true

          git push origin HEAD:kernel-4.14.186 || true

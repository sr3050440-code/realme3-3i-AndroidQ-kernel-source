name: Build Realme 3i Custom Kernel (Auto-Healing)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Auto-Heal Git & Workspace Setup
        run: |
          git config --global --add safe.directory "*"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Setup Build Dependencies & Python 2 Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncurses-dev zip libgnutls28-dev python2 python2-minimal

          # Force 'python' to run as Python 2 for MediaTek DCT compatibility
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Toolchains
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64 || true
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32 || true

      - name: Auto-Heal Missing Oppo Vendor Headers
        run: |
          # Create dummy/stub header with necessary definitions for oppo_phoenix
          mkdir -p vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/
          cat << 'EOF' > vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/oppo_phoenix.h
          #ifndef _OPPO_PHOENIX_H
          #define _OPPO_PHOENIX_H

          #define phx_set_boot_stage(...) do {} while (0)

          #define KERNEL_MM_INIT_DONE 0
          #define KERNEL_LOCAL_IRQ_ENABLE 1
          #define KERNEL_DELAYACCT_INIT_DONE 2
          #define KERNEL_DRIVER_INIT_DONE 3
          #define KERNEL_DO_INITCALLS_DONE 4
          #define KERNEL_INIT_DONE 5
          #define KERNEL_DO_BASIC_SETUP_DONE 6

          #endif
          EOF

      - name: Auto-Heal Defconfig & Compile Kernel
        run: |
          set -o pipefail
          export PATH="$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Defconfig Auto-Finder
          if [ -f arch/arm64/configs/oppo6771_defconfig ]; then
            DEFCONFIG="oppo6771_defconfig"
          elif [ -f arch/arm64/configs/RMX1827_defconfig ]; then
            DEFCONFIG="RMX1827_defconfig"
          else
            DEFCONFIG=$(basename $(find arch/arm64/configs/ -name "*defconfig" | head -n 1))
          fi
          echo "Selected Defconfig: $DEFCONFIG"

          make O=out $DEFCONFIG

          # Compile Kernel with Native MTK GCC Compiler
          make -j$(nproc --all) O=out \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            CC=aarch64-linux-android-gcc \
            KCFLAGS="-Wno-error -fcommon -w" \
            2>&1 | tee build.log

      - name: Auto-Heal DTB & Collect Artifacts
        run: |
          mkdir -p release
          find out/arch/arm64/boot/ -maxdepth 2 -type f \( -name "Image*" -o -name "*.dtb" \) -exec cp {} release/ \;
          
          if [ ! -f release/Image.gz-dtb ] && [ -f release/Image.gz ]; then
            DTB_FILE=$(find out/arch/arm64/boot/dts/ -name "*.dtb" | head -n 1)
            if [ -n "$DTB_FILE" ]; then
              echo "Auto-Healing: Stitching Image.gz with DTB..."
              cat release/Image.gz "$DTB_FILE" > release/Image.gz-dtb
            fi
          fi

          echo "Final Artifacts:"
          ls -la release/

      - name: Upload Kernel Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-Kernel-Image
          path: release/

      - name: Upload Error Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Log
          path: build.log

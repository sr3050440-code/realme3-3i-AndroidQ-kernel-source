name: Build Realme 3i Custom Kernel (Nuke Old C Files & Stub Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Auto-Heal Git & Workspace Setup
        run: |
          git config --global --add safe.directory "*"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Setup Build Dependencies & Python 2 Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncurses-dev zip libgnutls28-dev python2 python2-minimal
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Toolchains
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64 || true
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32 || true

      - name: Nuke Buggy C Files and Inject Clean Stubs
        run: |
          echo "Removing problematic fingerprint drivers..."
          rm -rf drivers/input/oppo_fp_drivers || true
          sed -i '/oppo_fp_drivers/d' drivers/input/Makefile || true
          sed -i '/oppo_fp_drivers/d' drivers/input/Kconfig || true

          echo "Cleaning common video folders..."
          rm -rf drivers/misc/mediatek/video/common/layering_rule_base
          rm -rf drivers/misc/mediatek/video/common/color20

          mkdir -p drivers/misc/mediatek/video/common/layering_rule_base
          mkdir -p drivers/misc/mediatek/video/common/color20

          # Layering Rule Base Stub C file
          cat << 'EOF' > drivers/misc/mediatek/video/common/layering_rule_base/layering_stub.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          int layering_rule_calculation(void) { return 0; }
          EXPORT_SYMBOL(layering_rule_calculation);
          EOF

          cat << 'EOF' > drivers/misc/mediatek/video/common/layering_rule_base/Makefile
          obj-y := layering_stub.o
          EOF

          # Color20 Stub
          cat << 'EOF' > drivers/misc/mediatek/video/common/color20/color_stub.c
          #include <linux/module.h>
          #include <linux/kernel.h>
          int mtk_color_adjust_stub(void) { return 0; }
          EXPORT_SYMBOL(mtk_color_adjust_stub);
          EOF

          cat << 'EOF' > drivers/misc/mediatek/video/common/color20/Makefile
          obj-y := color_stub.o
          EOF

          echo "Creating universal stub headers..."
          mkdir -p include/oppo include/soc/qcom include/linux include/soc/oppo vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/
          mkdir -p drivers/misc/mediatek/smi drivers/misc/mediatek/ext_disp/mt6771

          cat << 'EOF' > include/oppo/oppo_vooc.h
          #ifndef __OPPO_VOOC_H__
          #define __OPPO_VOOC_H__
          #endif
          EOF

          cat << 'EOF' > include/disp_assert_layer.h
          #ifndef __DISP_ASSERT_LAYER_H__
          #define __DISP_ASSERT_LAYER_H__
          #endif
          EOF
          cp include/disp_assert_layer.h drivers/misc/mediatek/smi/disp_assert_layer.h || true

          cat << 'EOF' > include/disp_drv_log.h
          #ifndef __DISP_DRV_LOG_H__
          #define __DISP_DRV_LOG_H__
          #endif
          EOF
          cp include/disp_drv_log.h drivers/misc/mediatek/ext_disp/mt6771/disp_drv_log.h || true

          cat << 'EOF' > include/disp_power.h
          #ifndef __DISP_POWER_H__
          #define __DISP_POWER_H__
          #endif
          EOF
          cp include/disp_power.h drivers/misc/mediatek/ext_disp/mt6771/disp_power.h || true

          cat << 'EOF' > include/soc/qcom/scm.h
          #ifndef _SOC_QCOM_SCM_H
          #define _SOC_QCOM_SCM_H
          static inline int qcom_scm_is_available(void) { return 0; }
          #endif
          EOF

          cat << 'EOF' > include/soc/qcom/fsee.h
          #ifndef _SOC_QCOM_FSEE_H
          #define _SOC_QCOM_FSEE_H
          #endif
          EOF

          cat << 'EOF' > include/linux/oppo_phoenix.h
          #ifndef _OPPO_PHOENIX_H
          #define _OPPO_PHOENIX_H
          static inline void phx_set_boot_stage(const char *stage) { (void)stage; }
          static inline void phx_set_boot_error(const char *error) { (void)error; }
          static inline void phx_set_boot_info(const char *info) { (void)info; }
          #define KERNEL_MM_INIT_DONE 0
          #define KERNEL_LOCAL_IRQ_ENABLE 1
          #define KERNEL_DELAYACCT_INIT_DONE 2
          #define KERNEL_DRIVER_INIT_DONE 3
          #define KERNEL_DO_INITCALLS_DONE 4
          #define KERNEL_INIT_DONE 5
          #define KERNEL_DO_BASIC_SETUP_DONE 6
          #define ERROR_KERNEL_PANIC 0
          #define ERROR_INT 0
          #define ERROR_AEE 0
          #define ERROR_KE 0
          #define ERROR_NE 0
          #define ERROR_JE 0
          #ifndef ANDROID_LOG_INFO
          #define ANDROID_LOG_UNKNOWN 0
          #define ANDROID_LOG_DEFAULT 1
          #define ANDROID_LOG_VERBOSE 2
          #define ANDROID_LOG_DEBUG 3
          #define ANDROID_LOG_INFO 4
          #define ANDROID_LOG_WARN 5
          #define ANDROID_LOG_ERROR 6
          #define ANDROID_LOG_FATAL 7
          #define ANDROID_LOG_SILENT 8
          #endif
          #endif
          EOF
          cp include/linux/oppo_phoenix.h include/soc/oppo/oppo_phoenix.h 2>/dev/null || true
          cp include/linux/oppo_phoenix.h vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/oppo_phoenix.h 2>/dev/null || true

          # Python patch to fix panic.c and directly embed everything inside layering_rule.h
          python3 -c "
          import glob
          
          # Patch panic.c
          try:
              with open('kernel/panic.c', 'r') as f:
                  content = f.read()
              content = content.replace('phx_set_boot_error(ERROR_INT);', '// phx_set_boot_error(ERROR_INT);')
              content = content.replace('phx_set_boot_error', '// phx_set_boot_error')
              with open('kernel/panic.c', 'w') as f:
                  f.write(content)
          except Exception:
              pass

          # Patch layering_rule.h to embed definitions directly, bypassing missing header issues
          for path in glob.glob('**/layering_rule.h', recursive=True):
              try:
                  with open(path, 'r') as f:
                      content = f.read()
                  
                  embedded_code = '''
          #ifndef __LAYERING_RULE_BASE_H__
          #define __LAYERING_RULE_BASE_H__
          static inline int layering_rule_calculation(void) { return 0; }
          #define HRT_PATH_OSZ_NONE 0
          #define HRT_PATH_PIPE_SINGLE 1
          #define HRT_PATH_DISP_DUAL_EXT 2
          #define HRT_PATH_OSZ_PARTIAL 3
          #define HRT_PATH_DISP_SINGLE 4
          #define HRT_PATH_UNKNOWN 5
          #define HRT_PATH_NUM 6
          #endif
          '''
                  content = content.replace('#include \"layering_rule_base.h\"', embedded_code)
                  content = content.replace('#include <layering_rule_base.h>', embedded_code)
                  
                  with open(path, 'w') as f:
                      f.write(content)
              except Exception as e:
                  print(f'Error patching {path}: {e}')
          " || true

      - name: Compile Kernel
        run: |
          set -o pipefail
          export PATH="$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          if [ -f arch/arm64/configs/oppo6771_defconfig ]; then
            DEFCONFIG="oppo6771_defconfig"
          elif [ -f arch/arm64/configs/RMX1827_defconfig ]; then
            DEFCONFIG="RMX1827_defconfig"
          else
            DEFCONFIG=$(basename $(find arch/arm64/configs/ -name "*defconfig" | head -n 1))
          fi
          echo "Selected Defconfig: $DEFCONFIG"
          make O=out $DEFCONFIG
          
          STUB_HEADER="$(pwd)/include/linux/oppo_phoenix.h"
          MAKE_OPTS="O=out HOSTCC=gcc HOSTCXX=g++ HOSTCFLAGS=-fcommon HOSTCXXFLAGS=-fcommon CC=aarch64-linux-android-gcc"
          EXTRA_FLAGS="-Wno-error -fcommon -fpermissive -w -I$(pwd)/include -I$(pwd)/include/oppo -include ${STUB_HEADER}"
          
          make -j$(nproc --all) $MAKE_OPTS KCFLAGS="$EXTRA_FLAGS" 2>&1 | tee build.log

      - name: Collect Artifacts
        run: |
          mkdir -p release
          find out/arch/arm64/boot/ -maxdepth 2 -type f \( -name "Image*" -o -name "*.dtb" \) -exec cp {} release/ \;
          if [ ! -f release/Image.gz-dtb ] && [ -f release/Image.gz ]; then
            DTB_FILE=$(find out/arch/arm64/boot/dts/ -name "*.dtb" | head -n 1)
            if [ -n "$DTB_FILE" ]; then
              echo "Stitching Image.gz with DTB..."
              cat release/Image.gz "$DTB_FILE" > release/Image.gz-dtb
            fi
          fi
          echo "Final Artifacts:"
          ls -la release/

      - name: Upload Kernel Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-Kernel-Image
          path: release/

      - name: Upload Error Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Log
          path: build.log

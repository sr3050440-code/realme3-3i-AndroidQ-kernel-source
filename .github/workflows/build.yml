name: Realme 3i Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone kernel source
        run: |
          git clone --depth=1 https://github.com/sr3050440-code/realme3-3i-AndroidQ-kernel-source.git kernel
          cd kernel

      - name: Show kernel version
        run: |
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

      - name: Build
        run: |
          cd kernel
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2

name: Build Realme 3i MT6771 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      KBUILD_BUILD_USER: github
      KBUILD_BUILD_HOST: actions
      TZ: Asia/Kolkata

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            rsync \
            zip \
            unzip \
            file \
            xz-utils \
            gzip \
            bzip2 \
            tar \
            wget \
            curl \
            git \
            patch \
            perl \
            sed \
            awk \
            python3 \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi \
            clang \
            lld \
            llvm \
            llvm-dev

          echo "=========================================="
          echo "DEPENDENCIES"
          echo "=========================================="

          gcc --version
          clang --version
          ld.lld --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version
          python3 --version


      # ============================================================
      # SOURCE CLEANUP
      # ============================================================

      - name: Prepare Kernel Source
        shell: bash
        run: |
          set -eux

          git config --global core.autocrlf false

          echo "=========================================="
          echo "CHECKING KERNEL SOURCE"
          echo "=========================================="

          test -d arch
          test -d kernel
          test -d scripts
          test -f Makefile

          echo "Kernel source found."

          echo ""
          echo "=========================================="
          echo "REMOVE CRLF"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -name "*.c" \
              -o -name "*.h" \
              -o -name "*.S" \
              -o -name "*.s" \
              -o -name "*.mk" \
              -o -name "Makefile" \
              -o -name "Makefile.*" \
              -o -name "*.py" \
              -o -name "*.sh" \
            \) \
            -exec sed -i 's/\r$//' {} \; \
            2>/dev/null || true

          echo "CRLF cleanup completed."


      # ============================================================
      # CHECK MT6771 / OPPO SOURCE
      # ============================================================

      - name: Check MT6771 Source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MT6771 SOURCE CHECK"
          echo "=========================================="

          echo ""
          echo "===== DEFCONFIG ====="

          if [ -f arch/arm64/configs/oppo6771_defconfig ]; then
            echo "FOUND:"
            echo "arch/arm64/configs/oppo6771_defconfig"
          else
            echo "ERROR: oppo6771_defconfig not found."

            echo ""
            echo "Available MTK defconfigs:"
            find arch/arm64/configs \
              -type f \
              | grep -Ei '6771|mtk|oppo|realme' \
              | head -100 \
              || true

            exit 1
          fi

          echo ""
          echo "===== OPPO PHOENIX HEADER ====="

          PHOENIX_HEADER="$(find . \
            -type f \
            -name "oppo_phoenix.h" \
            -print \
            | head -n 1 || true)"

          if [ -n "$PHOENIX_HEADER" ]; then
            echo "FOUND:"
            echo "$PHOENIX_HEADER"
          else
            echo "WARNING:"
            echo "oppo_phoenix.h was not found."
            echo ""
            echo "Searching Phoenix files..."

            find . \
              -type f \
              \( \
                -iname "*phoenix*" \
                -o -iname "*oppo*" \
              \) \
              | head -200 \
              || true
          fi

          echo ""
          echo "===== DRVGEN ====="

          if [ -f tools/dct/DrvGen.py ]; then
            echo "FOUND tools/dct/DrvGen.py"
          else
            echo "WARNING: tools/dct/DrvGen.py not found."
          fi

          echo ""
          echo "===== DRVGEN MAKEFILE ====="

          if [ -f scripts/drvgen/drvgen.mk ]; then
            echo "FOUND scripts/drvgen/drvgen.mk"
          else
            echo "WARNING: scripts/drvgen/drvgen.mk not found."
          fi


      # ============================================================
      # FIX OLD PYTHON SCRIPT
      # ============================================================

      - name: Prepare DrvGen
        shell: bash
        run: |
          set -e

          if [ -f tools/dct/DrvGen.py ]; then

            echo "=========================================="
            echo "PREPARING DRVGEN"
            echo "=========================================="

            chmod +x tools/dct/DrvGen.py || true

            sed -i 's/\r$//' tools/dct/DrvGen.py

            head -n 5 tools/dct/DrvGen.py

            echo ""
            echo "Python syntax check..."

            python3 -m py_compile tools/dct/DrvGen.py \
              2>/dev/null \
              || true

          fi


      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: Setup Toolchain
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          mkdir -p "$GITHUB_WORKSPACE/toolchain/bin"

          for x in /usr/bin/aarch64-linux-gnu-*; do
            if [ -e "$x" ]; then
              ln -sf "$x" \
                "$GITHUB_WORKSPACE/toolchain/bin/"
            fi
          done

          for x in /usr/bin/arm-linux-gnueabi-*; do
            if [ -e "$x" ]; then
              ln -sf "$x" \
                "$GITHUB_WORKSPACE/toolchain/bin/"
            fi
          done

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo ""
          echo "===== AARCH64 GCC ====="
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version

          echo ""
          echo "===== ARM32 GCC ====="
          which arm-linux-gnueabi-gcc
          arm-linux-gnueabi-gcc --version

          echo ""
          echo "===== CLANG ====="
          which clang
          clang --version

          echo ""
          echo "===== LLD ====="
          which ld.lld
          ld.lld --version


      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Configure Kernel
        shell: bash
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          rm -rf out

          mkdir -p out

          echo "=========================================="
          echo "CONFIGURING OPPO MT6771"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            oppo6771_defconfig

          test -f out/.config

          echo ""
          echo "===== DISABLE DEBUG INFO ====="

          ./scripts/config \
            --file out/.config \
            --disable DEBUG_INFO \
            --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
            --disable DEBUG_INFO_DWARF4 \
            --disable DEBUG_INFO_DWARF5 \
            --disable DEBUG_INFO_BTF \
            2>/dev/null || true

          echo ""
          echo "===== FINAL CONFIG ====="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          echo ""
          echo "===== MT6771 CONFIG ====="

          grep -E \
            'CONFIG_MACH_MT6771|CONFIG_MTK_PLATFORM|CONFIG_ARCH_MTK_PROJECT|CONFIG_ARCH_MEDIATEK|CONFIG_DEBUG_INFO' \
            out/.config \
            || true

          echo ""
          echo "CONFIGURATION COMPLETE."

          test -f out/.config


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "REALME 3i MT6771 KERNEL BUILD"
          echo "=========================================="

          echo ""
          echo "Date:"
          date

          echo ""
          echo "===== COMPILERS ====="

          clang --version
          aarch64-linux-gnu-gcc --version

          echo ""
          echo "===== CONFIG ====="

          grep -E \
            'CONFIG_MACH_MT6771|CONFIG_MTK_PLATFORM|CONFIG_ARCH_MTK_PROJECT|CONFIG_ARCH_MEDIATEK|CONFIG_DEBUG_INFO' \
            out/.config \
            || true

          echo ""
          echo "=========================================="
          echo "STARTING BUILD"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            HOSTLDFLAGS="" \
            KCFLAGS="-Wno-error" \
            Image.gz \
            Image.gz-dtb \
            dtbs \
            2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "KERNEL BUILD FAILED"
            echo "=========================================="

            echo ""
            echo "===== LAST 150 BUILD LINES ====="

            tail -150 build.log || true

            exit "$BUILD_STATUS"
          fi

          echo "KERNEL BUILD SUCCESSFUL"
          echo "=========================================="


      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Kernel
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING KERNEL"
          echo "=========================================="

          BOOT="out/arch/arm64/boot"

          test -d "$BOOT"

          echo ""
          echo "===== BOOT DIRECTORY ====="

          ls -lah "$BOOT"

          echo ""
          echo "===== Image.gz ====="

          if [ ! -f "$BOOT/Image.gz" ]; then
            echo "ERROR: Image.gz was not generated."

            echo ""
            echo "Searching output..."

            find out \
              -type f \
              \( \
                -name "Image" \
                -o -name "Image.gz" \
                -o -name "*dtb" \
              \) \
              -print \
              || true

            exit 1
          fi

          ls -lh "$BOOT/Image.gz"

          echo ""
          echo "===== IMAGE.GZ FILE ====="

          file "$BOOT/Image.gz"

          echo ""
          echo "===== IMAGE.GZ HEADER ====="

          xxd -l 16 "$BOOT/Image.gz"

          echo ""
          echo "===== GZIP TEST ====="

          gzip -t "$BOOT/Image.gz"

          echo "Image.gz gzip test: OK"

          echo ""
          echo "===== DTB ====="

          find "$BOOT" \
            -type f \
            -name "*.dtb" \
            -exec ls -lh {} \; \
            2>/dev/null \
            || true

          echo ""
          echo "===== Image.gz-dtb ====="

          if [ -f "$BOOT/Image.gz-dtb" ]; then
            ls -lh "$BOOT/Image.gz-dtb"
          else
            echo "Image.gz-dtb not generated."
          fi


      # ============================================================
      # COLLECT OUTPUT
      # ============================================================

      - name: Collect Kernel
        shell: bash
        run: |
          set -e

          rm -rf kernel-output

          mkdir -p kernel-output

          BOOT="out/arch/arm64/boot"

          echo "=========================================="
          echo "COLLECTING KERNEL"
          echo "=========================================="

          cp "$BOOT/Image.gz" \
            kernel-output/Image.gz

          if [ -f "$BOOT/Image.gz-dtb" ]; then
            cp "$BOOT/Image.gz-dtb" \
              kernel-output/Image.gz-dtb
          fi

          if [ -d "$BOOT/dts" ]; then
            mkdir -p kernel-output/dts

            find "$BOOT/dts" \
              -type f \
              -name "*.dtb" \
              -exec cp --parents {} kernel-output/ \; \
              2>/dev/null \
              || true
          fi

          echo ""
          echo "===== OUTPUT ====="

          find kernel-output \
            -type f \
            -exec ls -lh {} \;

          echo ""
          echo "===== CREATE ZIP ====="

          cd kernel-output

          zip -r \
            ../Realme3i-MT6771-Kernel.zip \
            ./

          cd ..

          ls -lh \
            Realme3i-MT6771-Kernel.zip


      # ============================================================
      # BUILD LOG
      # ============================================================

      - name: Prepare Build Logs
        if: always()
        shell: bash
        run: |
          mkdir -p logs

          if [ -f build.log ]; then
            cp build.log logs/build.log
          fi

          if [ -f out/.config ]; then
            cp out/.config logs/kernel.config
          fi

          echo "===== LOG FILES ====="

          find logs \
            -type f \
            -exec ls -lh {} \; \
            || true


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-MT6771-Kernel
          path: |
            Realme3i-MT6771-Kernel.zip
            kernel-output/
          if-no-files-found: error
          compression-level: 9


      # ============================================================
      # UPLOAD BUILD LOG
      # ============================================================

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-MT6771-Build-Logs
          path: logs/
          if-no-files-found: ignore

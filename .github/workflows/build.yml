name: Realme 3i MT6771 Android Q Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      TZ: Asia/Kolkata

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            dwarves \
            cpio \
            rsync \
            device-tree-compiler \
            zip \
            unzip \
            gzip \
            xz-utils \
            file \
            wget \
            curl \
            git \
            patch \
            perl \
            python2.7 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

          # Ubuntu 22.04 does not normally provide a "python2"
          # executable package, so create our own aliases.
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python

          echo "=========================================="
          echo "DEPENDENCIES"
          echo "=========================================="

          python2 --version
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version
          dtc --version


      # ============================================================
      # SOURCE PREPARATION
      # ============================================================

      - name: Prepare Source
        shell: bash
        run: |
          set -eux

          git config --global core.autocrlf false

          echo "=========================================="
          echo "SOURCE CHECK"
          echo "=========================================="

          test -f Makefile
          test -f arch/arm64/configs/oppo6771_defconfig

          echo "Kernel source OK."

          echo ""
          echo "=========================================="
          echo "REMOVE CRLF"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -name "*.c" \
              -o -name "*.h" \
              -o -name "*.S" \
              -o -name "*.s" \
              -o -name "*.mk" \
              -o -name "Makefile" \
              -o -name "Makefile.*" \
              -o -name "*.py" \
              -o -name "*.sh" \
            \) \
            -exec sed -i 's/\r$//' {} \; \
            2>/dev/null || true

          echo "CRLF cleanup complete."


      # ============================================================
      # CHECK REQUIRED MTK FILES
      # ============================================================

      - name: Check MT6771 Files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MT6771 FILE CHECK"
          echo "=========================================="

          echo ""
          echo "===== DEFCONFIG ====="

          test -f \
            arch/arm64/configs/oppo6771_defconfig

          echo "OK"


          echo ""
          echo "===== DRVGEN ====="

          if [ -f tools/dct/DrvGen.py ]; then
            echo "DrvGen.py found"
          else
            echo "WARNING: DrvGen.py not found"
          fi

          if [ -f scripts/drvgen/drvgen.mk ]; then
            echo "drvgen.mk found"
          else
            echo "WARNING: drvgen.mk not found"
          fi


          echo ""
          echo "===== DWS ====="

          find drivers/misc/mediatek/dws \
            -type f \
            -name "*.dws" \
            -print \
            2>/dev/null \
            | head -100 \
            || true


          echo ""
          echo "===== PHOENIX SEARCH ====="

          find . \
            -type f \
            \( \
              -name "oppo_phoenix.h" \
              -o -iname "*phoenix*.h" \
            \) \
            -print \
            2>/dev/null \
            | head -100 \
            || true


          echo ""
          echo "===== PHOENIX REFERENCES ====="

          grep -RFn \
            "oppo_phoenix" \
            arch \
            drivers \
            include \
            kernel \
            fs \
            mm \
            2>/dev/null \
            | head -100 \
            || true


      # ============================================================
      # DRVGEN PYTHON 2
      # ============================================================

      - name: Prepare DrvGen
        shell: bash
        run: |
          set -e

          if [ -f tools/dct/DrvGen.py ]; then

            echo "=========================================="
            echo "DRVGEN"
            echo "=========================================="

            chmod +x tools/dct/DrvGen.py

            sed -i 's/\r$//' tools/dct/DrvGen.py

            sed -i \
              '1s|^#!.*|#!/usr/bin/env python2|' \
              tools/dct/DrvGen.py

            head -n 5 tools/dct/DrvGen.py

            echo ""
            echo "Python 2:"
            python2 --version

          fi


      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: Setup Cross Compiler
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/toolchain/bin"

          for tool in /usr/bin/aarch64-linux-gnu-*; do
            if [ -e "$tool" ]; then
              ln -sf "$tool" \
                "$GITHUB_WORKSPACE/toolchain/bin/"
            fi
          done

          for tool in /usr/bin/arm-linux-gnueabi-*; do
            if [ -e "$tool" ]; then
              ln -sf "$tool" \
                "$GITHUB_WORKSPACE/toolchain/bin/"
            fi
          done

          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          which aarch64-linux-gnu-gcc
          which aarch64-linux-gnu-ld
          which aarch64-linux-gnu-objdump

          which arm-linux-gnueabi-gcc

          echo ""
          aarch64-linux-gnu-gcc --version

          echo ""
          aarch64-linux-gnu-objdump --version

          echo ""
          arm-linux-gnueabi-gcc --version


      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Configure Kernel
        shell: bash
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export PYTHON=python2
          export python=python2

          rm -rf out

          mkdir -p out

          echo "=========================================="
          echo "CONFIGURE OPPO6771"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            oppo6771_defconfig

          test -f out/.config

          echo ""
          echo "===== CONFIG ====="

          grep -E \
            'CONFIG_MACH_MT6771|CONFIG_MTK_PLATFORM|CONFIG_ARCH_MTK_PROJECT|CONFIG_CROSS_COMPILE|CONFIG_BUILD_ARM64' \
            out/.config \
            || true


      # ============================================================
      # DISABLE DEBUG INFO
      # ============================================================

      - name: Fix Debug Configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DISABLE DEBUG INFO"
          echo "=========================================="

          if [ -x scripts/config ]; then

            ./scripts/config \
              --file out/.config \
              --disable DEBUG_INFO \
              --disable DEBUG_INFO_DWARF4 \
              --disable DEBUG_INFO_DWARF5 \
              --disable DEBUG_INFO_BTF \
              2>/dev/null || true

          else

            sed -i \
              '/^CONFIG_DEBUG_INFO=/d' \
              out/.config

            sed -i \
              '/^CONFIG_DEBUG_INFO_DWARF/d' \
              out/.config

            sed -i \
              '/^CONFIG_DEBUG_INFO_BTF=/d' \
              out/.config

            echo "# CONFIG_DEBUG_INFO is not set" \
              >> out/.config

          fi

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          echo ""
          grep \
            -E '^CONFIG_DEBUG_INFO|^# CONFIG_DEBUG_INFO' \
            out/.config \
            || true


      # ============================================================
      # VERIFY DT SOURCE
      # ============================================================

      - name: Check Device Tree
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DEVICE TREE"
          echo "=========================================="

          echo ""
          echo "===== MT6771 DTS ====="

          find arch/arm64/boot/dts \
            -type f \
            \( \
              -name "*6771*.dts" \
              -o -name "*6771*.dtsi" \
            \) \
            -print \
            2>/dev/null \
            | head -100 \
            || true

          echo ""
          echo "===== OPPO6771 ====="

          find arch/arm64/boot/dts \
            -type f \
            -iname "*oppo6771*" \
            -print \
            2>/dev/null \
            || true


      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export PYTHON=python2
          export python=python2

          echo "=========================================="
          echo "REALME 3i MT6771 KERNEL"
          echo "=========================================="

          echo ""
          echo "Kernel:"
          grep -E \
            '^VERSION|^PATCHLEVEL|^SUBLEVEL' \
            Makefile \
            | head -5

          echo ""
          echo "Compiler:"
          aarch64-linux-gnu-gcc --version | head -1

          echo ""
          echo "=========================================="
          echo "BUILD START"
          echo "=========================================="

          rm -f build.log

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            PYTHON=python2 \
            python=python2 \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error" \
            Image.gz \
            Image.gz-dtb \
            dtbs \
            2>&1 | tee build.log

          status=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="

          if [ "$status" -ne 0 ]; then
            echo "BUILD FAILED"
            echo "=========================================="

            echo ""
            echo "===== FIRST ERRORS ====="

            grep -n \
              -E 'error:|Error:|fatal error:|No such file|undefined reference' \
              build.log \
              | head -50 \
              || true

            echo ""
            echo "===== LAST 200 LINES ====="

            tail -200 build.log

            exit "$status"
          fi

          echo "BUILD SUCCESS"
          echo "=========================================="


      # ============================================================
      # VERIFY OUTPUT
      # ============================================================

      - name: Verify Kernel
        shell: bash
        run: |
          set -e

          BOOT="out/arch/arm64/boot"

          echo "=========================================="
          echo "VERIFY KERNEL"
          echo "=========================================="

          test -d "$BOOT"

          echo ""
          echo "===== BOOT ====="

          ls -lah "$BOOT"

          echo ""
          echo "===== IMAGE ====="

          if [ ! -f "$BOOT/Image.gz" ]; then
            echo "ERROR: Image.gz not found."

            find out \
              -type f \
              \( \
                -name "Image" \
                -o -name "Image.gz" \
                -o -name "*.dtb" \
              \) \
              -print \
              | head -200

            exit 1
          fi

          ls -lh "$BOOT/Image.gz"

          echo ""
          echo "===== FILE ====="

          file "$BOOT/Image.gz"

          echo ""
          echo "===== HEADER ====="

          xxd -l 16 "$BOOT/Image.gz"

          echo ""
          echo "===== GZIP ====="

          gzip -t "$BOOT/Image.gz"

          echo "Image.gz is valid."


          echo ""
          echo "===== DTB ====="

          find "$BOOT/dts" \
            -type f \
            -name "*.dtb" \
            -exec ls -lh {} \; \
            2>/dev/null \
            || true


          echo ""
          echo "===== IMAGE.GZ-DTB ====="

          if [ -f "$BOOT/Image.gz-dtb" ]; then
            ls -lh "$BOOT/Image.gz-dtb"
          else
            echo "Image.gz-dtb was not generated."
          fi


      # ============================================================
      # COLLECT
      # ============================================================

      - name: Collect Kernel
        if: success()
        shell: bash
        run: |
          set -e

          BOOT="out/arch/arm64/boot"

          rm -rf kernel-output

          mkdir -p kernel-output

          cp \
            "$BOOT/Image.gz" \
            kernel-output/Image.gz

          if [ -f "$BOOT/Image.gz-dtb" ]; then
            cp \
              "$BOOT/Image.gz-dtb" \
              kernel-output/Image.gz-dtb
          fi

          if [ -d "$BOOT/dts" ]; then

            mkdir -p kernel-output/dts

            find "$BOOT/dts" \
              -type f \
              -name "*.dtb" \
              -exec cp {} kernel-output/dts/ \; \
              2>/dev/null \
              || true

          fi

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          find kernel-output \
            -type f \
            -exec ls -lh {} \;


      # ============================================================
      # ZIP
      # ============================================================

      - name: Create ZIP
        if: success()
        shell: bash
        run: |
          set -e

          cd kernel-output

          zip -r \
            ../Realme3i-MT6771-Kernel.zip \
            .

          cd ..

          ls -lh \
            Realme3i-MT6771-Kernel.zip


      # ============================================================
      # UPLOAD KERNEL
      # ============================================================

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-MT6771-Kernel
          path: |
            Realme3i-MT6771-Kernel.zip
            kernel-output/
          if-no-files-found: error


      # ============================================================
      # SAVE BUILD LOG
      # ============================================================

      - name: Save Build Logs
        if: always()
        shell: bash
        run: |
          mkdir -p logs

          if [ -f build.log ]; then
            cp build.log logs/build.log
          fi

          if [ -f out/.config ]; then
            cp out/.config logs/kernel.config
          fi

          echo "===== LOG CONTENT ====="

          if [ -f logs/build.log ]; then
            tail -200 logs/build.log
          fi


      # ============================================================
      # UPLOAD LOG
      # ============================================================

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-MT6771-Build-Logs
          path: logs/
          if-no-files-found: ignore

name: Realme 3i MT6771 Android Q Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Realme 3i MT6771 Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      # ==========================================================
      # 2. BASIC SOURCE VERIFICATION
      # ==========================================================

      - name: Verify Repository
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          pwd

          echo ""
          echo "Git remote:"
          git remote -v || true

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Kernel version:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile

          echo ""
          echo "Top-level directories:"
          find . -maxdepth 1 -type d | sort

          echo ""
          echo "Checking required files..."

          test -f Makefile
          test -f Kconfig
          test -f arch/arm64/Makefile
          test -f arch/arm64/configs/oppo6771_defconfig
          test -f arch/arm64/kernel/entry.S

          echo ""
          echo "Required files: OK"

      # ==========================================================
      # 3. VERIFY ORIGINAL ENTRY.S
      # ==========================================================

      - name: Verify Entry Source
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "ENTRY.S VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Phoenix references in entry.S:"

          if grep -nEi \
            'oppo_phoenix|phoenix\.h' \
            arch/arm64/kernel/entry.S; then

            echo ""
            echo "ERROR:"
            echo "entry.S unexpectedly contains Phoenix reference."

            exit 1
          else
            echo "No Phoenix reference in entry.S."
          fi

          echo ""
          echo "First 45 lines of entry.S:"
          sed -n '1,45p' arch/arm64/kernel/entry.S

      # ==========================================================
      # 4. VERIFY WHOLE SOURCE TREE
      # ==========================================================

      - name: Scan Phoenix References
        shell: bash
        run: |
          set -u

          echo "=========================================="
          echo "PHOENIX SOURCE SCAN"
          echo "=========================================="

          echo ""
          echo "Searching source tree..."

          FOUND=0

          while IFS= read -r -d '' file; do
            if grep -IEn \
              'oppo_phoenix|phoenix\.h' \
              "$file" >/dev/null 2>&1; then

              echo "------------------------------------------"
              echo "$file"
              grep -In \
                'oppo_phoenix|phoenix\.h' \
                "$file" || true

              FOUND=1
            fi
          done < <(
            find . \
              -type f \
              \( \
                -name '*.c' \
                -o -name '*.h' \
                -o -name '*.S' \
                -o -name '*.s' \
                -o -name '*.mk' \
                -o -name 'Makefile' \
                -o -name 'Makefile.*' \
              \) \
              -print0
          )

          echo ""
          echo "Phoenix scan finished."

          if [ "$FOUND" -eq 0 ]; then
            echo "No Phoenix references found."
          fi

      # ==========================================================
      # 5. INSTALL BUILD DEPENDENCIES
      # ==========================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            make \
            python2 \
            python3 \
            rsync \
            unzip \
            zip

          echo ""
          echo "=========================================="
          echo "TOOLCHAIN VERSIONS"
          echo "=========================================="

          gcc --version | head -1

          echo ""
          aarch64-linux-gnu-gcc --version | head -1

          echo ""
          arm-linux-gnueabi-gcc --version | head -1

          echo ""
          python2 --version

      # ==========================================================
      # 6. PYTHON 2
      # ==========================================================

      - name: Prepare Python 2
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "PYTHON 2"
          echo "=========================================="

          command -v python2
          python2 --version

          if [ -f tools/dct/DrvGen.py ]; then
            echo ""
            echo "Checking DrvGen.py..."

            python2 -m py_compile tools/dct/DrvGen.py

            echo "DrvGen.py syntax: OK"
          else
            echo "DrvGen.py not present."
          fi

      # ==========================================================
      # 7. SAFE CRLF CLEANUP
      # ==========================================================

      - name: Normalize Source Line Endings
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "LINE ENDINGS"
          echo "=========================================="

          git ls-files -z -- \
            '*.c' \
            '*.h' \
            '*.S' \
            '*.s' \
            '*.mk' \
            'Makefile' \
            'Makefile.*' \
            '*.py' \
            '*.sh' |
          while IFS= read -r -d '' file; do
            sed -i 's/\r$//' "$file"
          done

          echo "Line-ending normalization complete."

      # ==========================================================
      # 8. RE-CHECK ENTRY.S AFTER PREPARATION
      # ==========================================================

      - name: Verify Source Was Not Modified
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "POST-PREP SOURCE CHECK"
          echo "=========================================="

          if grep -nEi \
            'oppo_phoenix|phoenix\.h' \
            arch/arm64/kernel/entry.S; then

            echo ""
            echo "ERROR: Phoenix include appeared in entry.S."
            exit 1
          fi

          echo "entry.S remains clean."

      # ==========================================================
      # 9. CREATE BUILD DIRECTORY
      # ==========================================================

      - name: Prepare Build Directory
        shell: bash
        run: |
          set -eux

          rm -rf out

          mkdir -p out

          echo "Build directory:"
          ls -ld out

      # ==========================================================
      # 10. DEFCONFIG
      # ==========================================================

      - name: Configure Kernel
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "KERNEL CONFIGURATION"
          echo "=========================================="

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            oppo6771_defconfig

          test -f out/.config

          echo ""
          echo "Configuration generated."

          echo ""
          echo "Important configuration:"
          grep -E \
            'CONFIG_(64BIT|ARM64|ARM|MTK|MACH|OPPO|REALME)' \
            out/.config \
            | head -100 || true

      # ==========================================================
      # 11. OLDDEFCONFIG
      # ==========================================================

      - name: Finalize Kernel Configuration
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "OLDDEFCONFIG"
          echo "=========================================="

          make \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          test -f out/.config

          echo "Configuration finalized."

      # ==========================================================
      # 12. CHECK GENERATED CONFIG
      # ==========================================================

      - name: Verify Generated Config
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "CONFIG CHECK"
          echo "=========================================="

          grep -E \
            '^CONFIG_(ARM64|64BIT|SMP|PREEMPT|MTK|MTK_PLATFORM)' \
            out/.config \
            | head -100 || true

      # ==========================================================
      # 13. CHECK DEVICE TREE
      # ==========================================================

      - name: Check Device Tree
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "DEVICE TREE"
          echo "=========================================="

          if [ -d arch/arm64/boot/dts ]; then

            echo ""
            echo "DTS directories:"
            find arch/arm64/boot/dts \
              -maxdepth 2 \
              -type d \
              | sort \
              | head -100

            echo ""
            echo "Realme/OPPO/MT6771 DTS files:"

            find arch/arm64/boot/dts \
              -type f \
              \( \
                -name '*.dts' \
                -o -name '*.dtsi' \
              \) \
              | grep -Ei \
                'realme|oppo|6771|mtk' \
              | head -200 || true

          else
            echo "arch/arm64/boot/dts does not exist."
          fi

      # ==========================================================
      # 14. PRE-BUILD SANITY CHECK
      # ==========================================================

      - name: Pre Build Sanity Check
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "PRE-BUILD CHECK"
          echo "=========================================="

          test -f Makefile
          test -f out/.config
          test -f arch/arm64/kernel/entry.S

          echo ""
          echo "Checking for accidental Phoenix include..."

          if grep -RIn \
            'vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/oppo_phoenix.h' \
            . \
            --exclude-dir=.git \
            --exclude-dir=out; then

            echo ""
            echo "ERROR: Missing Phoenix dependency referenced by source."
            echo "Build stopped before compiler starts."

            exit 1
          fi

          echo ""
          echo "No missing Phoenix header reference found."

      # ==========================================================
      # 15. BUILD
      # ==========================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "BUILD KERNEL"
          echo "=========================================="

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo ""
          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"

          echo ""
          echo "Compiler:"
          aarch64-linux-gnu-gcc --version | head -1

          echo ""
          echo "Starting kernel build..."

          make \
            -j"$(nproc)" \
            O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz \
            Image.gz-dtb \
            dtbs \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # ==========================================================
      # 16. VERIFY IMAGE
      # ==========================================================

      - name: Verify Kernel Output
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          BOOT="out/arch/arm64/boot"

          echo ""
          echo "Boot directory:"
          ls -lah "$BOOT" 2>/dev/null || true

          echo ""
          echo "Image:"
          if [ -f "$BOOT/Image" ]; then
            ls -lh "$BOOT/Image"
          else
            echo "Image not found."
          fi

          echo ""
          echo "Image.gz:"
          if [ -f "$BOOT/Image.gz" ]; then
            ls -lh "$BOOT/Image.gz"
          else
            echo "Image.gz not found."
          fi

          echo ""
          echo "Image.gz-dtb:"
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            ls -lh "$BOOT/Image.gz-dtb"
          else
            echo "Image.gz-dtb not found."
          fi

          echo ""
          echo "DTBs:"
          find "$BOOT" \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec ls -lh {} \; \
            2>/dev/null || true

      # ==========================================================
      # 17. SHOW REAL ERRORS
      # ==========================================================

      - name: Extract Build Errors
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "BUILD ERRORS"
          echo "=========================================="

          if [ ! -f build.log ]; then
            echo "build.log not found."
            exit 0
          fi

          echo ""
          echo "Fatal/compiler errors:"

          grep -n -E \
            'fatal error:|error:|Error [0-9]+|undefined reference|No such file or directory' \
            build.log \
            | head -100 \
            || true

          echo ""
          echo "Last 100 lines:"
          tail -100 build.log

      # ==========================================================
      # 18. COLLECT OUTPUT
      # ==========================================================

      - name: Collect Kernel
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "COLLECT"
          echo "=========================================="

          rm -rf kernel-output

          mkdir -p kernel-output

          BOOT="out/arch/arm64/boot"

          for file in \
            Image \
            Image.gz \
            Image.gz-dtb
          do
            if [ -f "$BOOT/$file" ]; then
              cp -v "$BOOT/$file" kernel-output/
            fi
          done

          find "$BOOT" \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -exec cp -v {} kernel-output/ \; \
            2>/dev/null || true

          echo ""
          echo "Collected files:"

          find kernel-output \
            -type f \
            -exec ls -lh {} \;

      # ==========================================================
      # 19. CREATE ZIP
      # ==========================================================

      - name: Create Kernel ZIP
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "CREATE ZIP"
          echo "=========================================="

          if [ -n "$(find kernel-output -type f -print -quit)" ]; then

            cd kernel-output

            zip -r \
              ../Realme3i-MT6771-AndroidQ-Kernel.zip \
              .

            cd ..

            echo ""
            echo "ZIP created:"
            ls -lh Realme3i-MT6771-AndroidQ-Kernel.zip

          else
            echo "No kernel output found."
          fi

      # ==========================================================
      # 20. UPLOAD KERNEL
      # ==========================================================

      - name: Upload Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-MT6771-AndroidQ-Kernel
          path: |
            kernel-output/**
            Realme3i-MT6771-AndroidQ-Kernel.zip
          if-no-files-found: warn
          retention-days: 7

      # ==========================================================
      # 21. UPLOAD LOGS
      # ==========================================================

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-MT6771-Build-Logs
          path: |
            build.log
            out/.config
          if-no-files-found: warn
          retention-days: 7

      # ==========================================================
      # 22. FINAL SUMMARY
      # ==========================================================

      - name: Final Summary
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL BUILD SUMMARY"
          echo "=========================================="

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz              : FOUND"
          else
            echo "Image.gz              : NOT FOUND"
          fi

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb          : FOUND"
          else
            echo "Image.gz-dtb          : NOT FOUND"
          fi

          if [ -f Realme3i-MT6771-AndroidQ-Kernel.zip ]; then
            echo "Kernel ZIP            : FOUND"
          else
            echo "Kernel ZIP            : NOT FOUND"
          fi

          echo ""
          echo "Build job finished."

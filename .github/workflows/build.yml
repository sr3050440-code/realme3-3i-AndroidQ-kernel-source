name: Build Realme 3i MT6771 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            zip \
            unzip \
            clang \
            lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python2 \
            python2.7 \
            device-tree-compiler \
            cpio \
            rsync

          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python

          echo "===== PYTHON ====="
          python2 --version
          python --version

          echo "===== CLANG ====="
          clang --version

          echo "===== AARCH64 GCC ====="
          aarch64-linux-gnu-gcc --version

          echo "===== ARM32 GCC ====="
          arm-linux-gnueabi-gcc --version


      # ============================================================
      # PREPARE SOURCE
      # ============================================================
      - name: Prepare Old Kernel Source
        shell: bash
        run: |
          set -e

          git config --global core.autocrlf false

          echo "===== CHECK FILES ====="

          test -f tools/dct/DrvGen.py
          test -f scripts/drvgen/drvgen.mk
          test -f arch/arm64/configs/oppo6771_defconfig

          echo "Required files found."

          # Remove CRLF from old source files
          find tools scripts arch \
            -type f \
            \
              -name "*.py" \
              -o -name "*.mk" \
              -o -name "Makefile" \
              -o -name "Makefile.*" \
            \
            -exec sed -i 's/\r$//' {} \; \
            2>/dev/null || true

          chmod +x tools/dct/DrvGen.py

          # Force DrvGen to Python 2
          sed -i \
            '1s|^#!.*python.*|#!/usr/bin/env python2|' \
            tools/dct/DrvGen.py

          echo "===== DRVGEN ====="
          head -n 3 tools/dct/DrvGen.py


      # ============================================================
      # FORCE DRVGEN PYTHON 2
      # ============================================================
      - name: Fix DrvGen Python 2
        shell: bash
        run: |
          set -e

          echo "===== BEFORE PATCH ====="

          grep -n \
            "DRVGEN_TOOL\|\$(python)" \
            scripts/drvgen/drvgen.mk \
            || true

          # Old kernel invokes:
          # $(python) $(DRVGEN_TOOL)
          #
          # Force Python 2 directly.

          sed -i \
            's/$(python) $(DRVGEN_TOOL)/python2 $(DRVGEN_TOOL)/g' \
            scripts/drvgen/drvgen.mk

          echo "===== AFTER PATCH ====="

          grep -n \
            "DrvGen.py\|\$(python)" \
            scripts/drvgen/drvgen.mk \
            || true


      # ============================================================
      # CROSS COMPILER
      # ============================================================
      - name: Setup Cross Compilers
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/gcc64/bin"
          mkdir -p "$GITHUB_WORKSPACE/gcc32/bin"

          for x in /usr/bin/aarch64-linux-gnu-*; do
            [ -e "$x" ] && \
              ln -sf "$x" \
              "$GITHUB_WORKSPACE/gcc64/bin/"
          done

          for x in /usr/bin/arm-linux-gnueabi-*; do
            [ -e "$x" ] && \
              ln -sf "$x" \
              "$GITHUB_WORKSPACE/gcc32/bin/"
          done

          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "===== TOOL PATHS ====="

          which aarch64-linux-gnu-gcc
          which aarch64-linux-gnu-objdump
          which arm-linux-gnueabi-gcc
          which clang

          echo "===== AARCH64 GCC ====="
          aarch64-linux-gnu-gcc --version

          echo "===== OBJDUMP ====="
          aarch64-linux-gnu-objdump --version

          echo "===== CLANG ====="
          clang --version


      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================
      - name: Configure Oppo6771 Kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export PYTHON=python2
          export python=python2

          rm -rf out

          echo "=========================================="
          echo "       CONFIGURING OPPO6771"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            oppo6771_defconfig

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          # --------------------------------------------------------
          # Disable debug information.
          #
          # Required because this old kernel's DWARF/debug data
          # can trigger modern objdump:
          #
          # "Unrecognized form: 0x22"
          # "Unrecognized form: 0x23"
          # --------------------------------------------------------

          sed -i \
            '/^CONFIG_DEBUG_INFO=/d' \
            out/.config

          sed -i \
            '/^CONFIG_DEBUG_INFO_DWARF/d' \
            out/.config

          sed -i \
            '/^CONFIG_DEBUG_INFO_BTF=/d' \
            out/.config

          echo '# CONFIG_DEBUG_INFO is not set' \
            >> out/.config

          echo '# CONFIG_DEBUG_INFO_BTF is not set' \
            >> out/.config

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "===== IMPORTANT CONFIG ====="

          grep -E \
            'CONFIG_MACH_MT6771|CONFIG_MTK_PLATFORM|CONFIG_ARCH_MTK_PROJECT|CONFIG_DEBUG_INFO' \
            out/.config \
            || true

          echo ""

          test -f out/.config


      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Compile Kernel
        shell: bash
        run: |
          set -o pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export PYTHON=python2
          export python=python2

          echo "=========================================="
          echo "       REALME 3i MT6771 KERNEL"
          echo "=========================================="

          echo ""
          echo "Build started:"
          date

          echo ""
          echo "===== PYTHON ====="
          python2 --version

          echo ""
          echo "===== COMPILER ====="
          clang --version

          echo ""
          echo "===== CONFIG ====="

          grep -E \
            'CONFIG_MACH_MT6771|CONFIG_MTK_PLATFORM|CONFIG_ARCH_MTK_PROJECT|CONFIG_DEBUG_INFO' \
            out/.config \
            || true

          echo ""
          echo "=========================================="
          echo "          STARTING KERNEL COMPILE"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTCFLAGS="-fcommon" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            PYTHON=python2 \
            python=python2 \
            KCFI=0 \
            Image.gz \
            Image.gz-dtb \
            dtbs \
            2>&1 | tee build.log

          echo ""
          echo "=========================================="
          echo "       KERNEL COMPILE FINISHED"
          echo "=========================================="

          date


      # ============================================================
      # VERIFY BUILD
      # ============================================================
      - name: Verify Kernel
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          VERIFYING OUTPUT"
          echo "=========================================="

          echo ""
          echo "===== BOOT DIRECTORY ====="

          ls -lah \
            out/arch/arm64/boot/

          echo ""
          echo "===== Image.gz ====="

          test -f \
            out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz

          echo ""
          echo "===== Image.gz-dtb ====="

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            ls -lh \
              out/arch/arm64/boot/Image.gz-dtb
          else
            echo "WARNING: Image.gz-dtb was not generated."
          fi

          echo ""
          echo "===== DTB FILES ====="

          find \
            out/arch/arm64/boot/dts \
            -type f \
            -name "*.dtb" \
            -exec ls -lh {} \; \
            2>/dev/null \
            || true


      # ============================================================
      # VERIFY GZIP
      # ============================================================
      - name: Verify Image.gz
        shell: bash
        run: |
          set -e

          echo "===== FILE ====="

          file \
            out/arch/arm64/boot/Image.gz

          echo ""
          echo "===== HEADER ====="

          xxd -l 16 \
            out/arch/arm64/boot/Image.gz

          python3 - <<'PY'
          path = "out/arch/arm64/boot/Image.gz"

          with open(path, "rb") as f:
              header = f.read(2)

          print("Header:", header.hex())

          if header != b"\x1f\x8b":
              raise SystemExit(
                  "ERROR: Image.gz is not gzip"
              )

          print("OK: Image.gz is valid gzip")
          PY


      # ============================================================
      # COLLECT KERNEL
      # ============================================================
      - name: Collect Kernel Files
        shell: bash
        run: |
          set -e

          rm -rf kernel-output

          mkdir -p kernel-output

          echo "===== COPYING Image.gz ====="

          cp \
            out/arch/arm64/boot/Image.gz \
            kernel-output/

          echo "===== COPYING Image.gz-dtb ====="

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp \
              out/arch/arm64/boot/Image.gz-dtb \
              kernel-output/
          fi

          echo "===== COPYING DTB FILES ====="

          find \
            out/arch/arm64/boot/dts \
           

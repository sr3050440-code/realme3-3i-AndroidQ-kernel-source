name: Build Realme 3i Kernel Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncurses-dev zip libgnutls28-dev python2 python2-minimal
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download GCC Toolchains (4.9)
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Inject Missing Phoenix Headers
        run: |
          mkdir -p include/linux include/oppo include/soc/oppo
          cat << 'EOF' > include/linux/oppo_phoenix.h
          #ifndef _OPPO_PHOENIX_H
          #define _OPPO_PHOENIX_H
          #include <linux/types.h>
          #define ERROR_KERNEL_PANIC 0
          #define ERROR_HNT 0
          #define ERROR_HINT 0
          static inline int phx_set_boot_stage(int stage) { return 0; }
          static inline int phx_set_boot_error(int error) { return 0; }
          static inline int phx_set_boot_info(int info) { return 0; }
          #endif
          EOF
          cp include/linux/oppo_phoenix.h include/oppo/oppo_phoenix.h 2>/dev/null || true
          cp include/linux/oppo_phoenix.h include/soc/oppo/oppo_phoenix.h 2>/dev/null || true

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Apply defconfig
          make O=out oppo6771_defconfig

          # Compile with error-suppression flags
          PHOENIX_H="$(pwd)/include/linux/oppo_phoenix.h"
          make -j$(nproc --all) O=out KCFLAGS="-Wno-error -w -fno-stack-protector -fcommon -DERROR_HNT=0 -include ${PHOENIX_H}"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Realme3i-Kernel-Image
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/mediatek/*.dtb

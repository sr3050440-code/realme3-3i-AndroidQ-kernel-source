name: Build RMX1827 Kernel - Final Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Source
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            zip \
            unzip \
            clang \
            lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python2 \
            python2.7 \
            device-tree-compiler

          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python2
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python

          echo "===== PYTHON ====="
          python2 --version
          python --version

          echo "===== CLANG ====="
          clang --version

          echo "===== GCC AARCH64 ====="
          aarch64-linux-gnu-gcc --version

          echo "===== GCC ARM32 ====="
          arm-linux-gnueabi-gcc --version


      # ============================================================
      # 3. PREPARE OLD KERNEL SOURCE
      # ============================================================
      - name: Prepare Kernel Source
        shell: bash
        run: |
          set -e

          git config --global core.autocrlf false

          echo "===== CHECK DRVGEN ====="
          test -f tools/dct/DrvGen.py

          # Remove Windows CRLF
          sed -i 's/\r$//' tools/dct/DrvGen.py

          chmod +x tools/dct/DrvGen.py

          # Force Python 2 shebang
          sed -i \
            '1s|^#!.*python.*|#!/usr/bin/env python2|' \
            tools/dct/DrvGen.py

          echo "===== DRVGEN HEADER ====="
          head -n 3 tools/dct/DrvGen.py

          echo "===== ORIGINAL DRVGEN MAKEFILE ====="
          grep -n "DRVGEN_TOOL\|\$(python)" \
            scripts/drvgen/drvgen.mk || true


      # ============================================================
      # 4. FORCE DRVGEN TO PYTHON 2
      # ============================================================
      - name: Fix DrvGen Python
        shell: bash
        run: |
          set -e

          # Old kernel invokes DrvGen through $(python).
          # Force it directly to Python 2.

          sed -i \
            's/$(python) $(DRVGEN_TOOL)/python2 $(DRVGEN_TOOL)/g' \
            scripts/drvgen/drvgen.mk

          echo "===== PATCHED DRVGEN MAKEFILE ====="

          grep -n "DrvGen.py" \
            scripts/drvgen/drvgen.mk || true


      # ============================================================
      # 5. CROSS COMPILER SETUP
      # ============================================================
      - name: Setup Cross Compilers
        shell: bash
        run: |
          set -e

          mkdir -p gcc64/bin
          mkdir -p gcc32/bin

          for x in /usr/bin/aarch64-linux-gnu-*; do
            [ -e "$x" ] && ln -sf "$x" gcc64/bin/
          done

          for x in /usr/bin/arm-linux-gnueabi-*; do
            [ -e "$x" ] && ln -sf "$x" gcc32/bin/
          done

          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "===== TOOLS ====="

          which aarch64-linux-gnu-gcc
          which aarch64-linux-gnu-objdump

          which arm-linux-gnueabi-gcc
          which clang

          echo "===== AARCH64 GCC ====="
          aarch64-linux-gnu-gcc --version

          echo "===== AARCH64 OBJDUMP ====="
          aarch64-linux-gnu-objdump --version

          echo "===== CLANG ====="
          clang --version


      # ============================================================
      # 6. CONFIGURE OPPO6771
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export PYTHON=python2
          export python=python2

          rm -rf out

          echo "=========================================="
          echo "       OPPO6771 KERNEL CONFIG"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            oppo6771_defconfig

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          # --------------------------------------------------------
          # Disable debug information.
          # Old kernel + modern binutils can produce
          # "Unrecognized form: 0x22/0x23" DWARF errors.
          # --------------------------------------------------------

          sed -i '/^CONFIG_DEBUG_INFO=/d' out/.config
          sed -i '/^CONFIG_DEBUG_INFO_DWARF/d' out/.config
          sed -i '/^CONFIG_DEBUG_INFO_BTF=/d' out/.config

          echo '# CONFIG_DEBUG_INFO is not set' >> out/.config
          echo '# CONFIG_DEBUG_INFO_BTF is not set' >> out/.config

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo ""
          echo "===== DEBUG CONFIG ====="

          grep -E \
            'CONFIG_DEBUG_INFO|CONFIG_DEBUG_INFO_DWARF|CONFIG_DEBUG_INFO_BTF' \
            out/.config || true

          echo ""
          echo "===== MT6771 CONFIG ====="

          grep -E \
            'CONFIG_MACH_MT6771|CONFIG_MTK_PLATFORM|CONFIG_ARCH_MTK_PROJECT' \
            out/.config || true

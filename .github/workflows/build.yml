name: Build Realme 3i Custom Kernel (Auto-Healing)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Auto-Heal Git & Workspace Setup
        run: |
          git config --global --add safe.directory "*"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncurses-dev zip libgnutls28-dev python3 python-is-python3 2to3

      - name: Download Toolchains & Fix Linker
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang || true
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc64 || true
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc32 || true
          
          # Remove conflicting legacy Clang linkers
          rm -f clang/bin/ld clang/bin/ld.lld

      - name: Setup Python 2/3 Compatibility Layer & Fix Scripts
        run: |
          set -o pipefail

          # 1. Inject Python 2 backward compatibility into Python 3 environment
          PYTHON_SITE=$(python3 -c "import site; print(site.getsitepackages()[0])")
          sudo bash -c "cat << 'EOF' > $PYTHON_SITE/sitecustomize.py
          import string
          import builtins

          string.atoi = lambda s, *args: int(s, *args) if args else int(s)
          string.atol = lambda s, *args: int(s, *args) if args else int(s)
          string.atof = lambda s: float(s)
          string.strip = lambda s, *args: s.strip(*args)
          string.split = lambda s, *args: s.split(*args)
          string.replace = lambda s, *args: s.replace(*args)
          string.lower = lambda s: s.lower()
          string.upper = lambda s: s.upper()

          def cmp(a, b):
              return (a > b) - (a < b)

          builtins.cmp = cmp
          EOF"

          # 2. Fix old Python 2 print/syntax statements
          find tools/ -name "*.py" -exec 2to3 -w -n {} + 2>/dev/null || true
          chmod -R +x tools/

      - name: Auto-Heal Defconfig & Compile Kernel
        run: |
          set -o pipefail
          export PATH="$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          # Defconfig Auto-Finder
          if [ -f arch/arm64/configs/oppo6771_defconfig ]; then
            DEFCONFIG="oppo6771_defconfig"
          elif [ -f arch/arm64/configs/RMX1827_defconfig ]; then
            DEFCONFIG="RMX1827_defconfig"
          else
            DEFCONFIG=$(basename $(find arch/arm64/configs/ -name "*defconfig" | head -n 1))
          fi
          echo "Selected Defconfig: $DEFCONFIG"

          make O=out $DEFCONFIG

          # Compile Kernel
          make -j$(nproc --all) O=out \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            KCFLAGS="-Wno-error -fcommon" \
            2>&1 | tee build.log

      - name: Auto-Heal DTB & Collect Artifacts
        run: |
          mkdir -p release
          find out/arch/arm64/boot/ -maxdepth 2 -type f \( -name "Image*" -o -name "*.dtb" \) -exec cp {} release/ \;
          
          if [ ! -f release/Image.gz-dtb ] && [ -f release/Image.gz ]; then
            DTB_FILE=$(find out/arch/arm64/boot/dts/ -name "*.dtb" | head -n 1)
            if [ -n "$DTB_FILE" ]; then
              echo "Auto-Healing: Stitching Image.gz with DTB..."
              cat release/Image.gz "$DTB_FILE" > release/Image.gz-dtb
            fi
          fi

          echo "Final Artifacts:"
          ls -la release/

      - name: Upload Kernel Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Realme3i-Kernel-Image
          path: release/

      - name: Upload Error Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Log
          path: build.log
